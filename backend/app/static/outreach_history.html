<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindMyProfessor — Outreach History</title>
  <link rel="stylesheet" href="/static/css/fmp.css">
  <style>
    .history-item {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-lg); padding: 1rem 1.35rem;
      margin-bottom: .85rem; box-shadow: var(--shadow-sm);
      transition: box-shadow .15s;
    }
    .history-item:hover { box-shadow: var(--shadow-md); }
    .history-item-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: .75rem; margin-bottom: .35rem;
    }
    .history-item h2 { margin: 0; font-size: 1rem; font-family: var(--font-serif); }
    .history-uni  { color: var(--muted); font-size: .875rem; }
    .history-subj { font-style: italic; font-size: .875rem; color: var(--ink); margin: .25rem 0; }
    .history-meta { font-size: .8rem; color: var(--muted); }

    /* Compose link */
    .compose-link {
      font-size: .8rem; color: var(--accent);
      text-decoration: none; margin-left: .5rem;
    }
    .compose-link:hover { text-decoration: underline; }

    .badge {
      display: inline-flex; align-items: center;
      padding: .2rem .6rem; border-radius: 999px;
      font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      white-space: nowrap; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <a class="nav-brand" href="/">FindMyProfessor</a>
      <div class="nav-links">
        <a href="/onboarding">CV Profile</a>
        <a href="/matches">Research Matches</a>
        <span aria-current="page">Outreach History</span>
      </div>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Outreach History</h1>
      <p class="lead">Your email drafts and sent outreach messages.</p>
    </div>

    <p id="page-status" class="status" aria-live="polite"></p>
    <div id="history-list"></div>
  </main>

  <script src="/static/js/outreach_api.js"></script>
  <script>
    const api       = window.FMPOutreachApi;
    const profileId = api.getProfileId();
    const statusEl  = document.getElementById("page-status");
    const listEl    = document.getElementById("history-list");

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function badgeHtml(status) {
      const s = String(status || "").toLowerCase();
      const classMap = {
        sent:    "badge-sent",
        ready:   "badge-ready",
        failed:  "badge-failed",
        sending: "badge-sending"
      };
      const cls = "badge " + (classMap[s] || "badge-generated");
      return '<span class="' + cls + '">' + esc(status) + '</span>';
    }

    function renderItem(item) {
      const prof   = esc(item.professor_name || "Professor");
      const uni    = item.university_name ? '<span class="history-uni"> — ' + esc(item.university_name) + '</span>' : "";
      const email  = item.professor_email ? '<span class="history-meta">' + esc(item.professor_email) + '</span>' : "";
      const cv     = item.cv_display_name ? '<span class="history-meta"> · CV: ' + esc(item.cv_display_name) + '</span>' : "";
      const sent   = item.sent_at ? '<span class="history-meta"> · Sent: ' + esc(item.sent_at.replace("T"," ").split(".")[0]) + ' UTC</span>' : "";
      const composeLink = item.professor_id
        ? '<a class="compose-link" href="/outreach/compose/' + esc(item.professor_id) + '">Compose again</a>'
        : "";
      return (
        '<div class="history-item">' +
          '<div class="history-item-top">' +
            '<div>' +
              '<h2>' + prof + uni + '</h2>' +
            '</div>' +
            badgeHtml(item.status) +
          '</div>' +
          '<p class="history-subj">' + esc(item.subject || "(no subject)") + '</p>' +
          '<div style="display:flex;flex-wrap:wrap;gap:.15rem .5rem;align-items:center">' +
            email + cv + sent + composeLink +
          '</div>' +
        '</div>'
      );
    }

    (async function() {
      if (!profileId) {
        statusEl.textContent = "";
        listEl.innerHTML = '<section><p>No profile selected. <a href="/onboarding">Review your CV</a> first.</p></section>';
        return;
      }
      statusEl.textContent = "Loading…";
      try {
        const items = await api.listHistory(profileId);
        statusEl.textContent = "";
        if (!items || !items.length) {
          listEl.innerHTML =
            '<section style="text-align:center;padding:2.5rem 1.5rem">' +
            '<p style="color:var(--muted);margin-bottom:1rem">No outreach history yet.</p>' +
            '<a href="/matches" class="btn-primary">Find research matches</a>' +
            '</section>';
        } else {
          listEl.innerHTML = items.map(renderItem).join("");
        }
      } catch(err) {
        statusEl.className = "status error";
        statusEl.textContent = err.message || "Unable to load history.";
        listEl.innerHTML =
          '<section><button type="button" class="secondary" id="retry">Retry</button></section>';
        document.getElementById("retry").onclick = function() { location.reload(); };
      }
    })();
  </script>
</body>
</html>
