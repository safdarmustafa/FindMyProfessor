<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindMyProfessor — Sign In</title>
  <link rel="stylesheet" href="/static/css/fmp.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .login-outer {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
    }
    .login-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-xl); padding: 2.75rem 3rem;
      width: 100%; max-width: 420px; text-align: center;
      box-shadow: var(--shadow-md);
    }
    .login-brand {
      font-family: var(--font-serif);
      font-size: 1.55rem; font-weight: 700; color: var(--navy);
      margin: 0 0 .3rem; display: block;
    }
    .login-tagline {
      color: var(--muted); font-size: .9rem; margin: 0 0 2.25rem;
    }
    .btn-google {
      display: inline-flex; align-items: center; gap: .7rem;
      width: 100%; justify-content: center;
      background: var(--card); color: #3c4043;
      border: 1px solid #dadce0; border-radius: var(--r-md);
      padding: .8rem 1.25rem; font-size: .97rem;
      font-family: var(--font-ui); font-weight: 600;
      cursor: pointer; transition: background .12s, box-shadow .12s;
      text-decoration: none;
    }
    .btn-google:hover {
      background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.1);
      text-decoration: none;
    }
    .btn-google svg { flex-shrink: 0; }

    .divider {
      border: none; border-top: 1px solid var(--line); margin: 1.75rem 0;
    }
    .user-info { display: none; }
    .user-email {
      font-weight: 600; color: var(--navy);
      word-break: break-all; margin: .2rem 0 1.25rem;
      font-size: .95rem;
    }
    .user-label { color: var(--muted); font-size: .82rem; margin: 0 0 .15rem; }
    .btn-continue {
      display: inline-block; width: 100%;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--r-md); padding: .8rem 1.25rem;
      font-size: .97rem; font-family: var(--font-ui); font-weight: 600;
      cursor: pointer; text-decoration: none; transition: background .12s;
      text-align: center;
    }
    .btn-continue:hover { background: var(--accent-dk); text-decoration: none; }
    .btn-logout {
      display: inline-block; margin-top: .85rem;
      background: none; border: none;
      color: var(--muted); font-size: .875rem;
      font-family: var(--font-ui); cursor: pointer;
      text-decoration: underline;
    }
    .btn-logout:hover { color: var(--danger); }
    .status-msg {
      font-size: .875rem; color: var(--muted); margin-top: 1rem; min-height: 1.3em;
    }
    .status-msg.error { color: var(--danger); }

    .login-footer {
      text-align: center; padding: 1.25rem;
      font-size: .8rem; color: var(--muted);
      border-top: 1px solid var(--line);
    }
    .login-footer a { color: var(--muted); text-decoration: none; margin: 0 .5rem; }
    .login-footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <main class="login-outer">
    <div class="login-card">
      <span class="login-brand">FindMyProfessor</span>
      <p class="login-tagline">Research discovery and outreach platform</p>

      <!-- Signed-out state -->
      <div id="sign-in-section">
        <button class="btn-google" id="btn-google-sign-in">
          <!-- Google G logo -->
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Continue with Google
        </button>
        <p class="status-msg" id="sign-in-status" aria-live="polite"></p>
      </div>

      <hr class="divider">

      <!-- Signed-in state -->
      <div class="user-info" id="user-info-section">
        <p class="user-label">Signed in as</p>
        <p class="user-email" id="user-email"></p>
        <a href="/onboarding" class="btn-continue">Continue to app &rarr;</a>
        <br>
        <button class="btn-logout" id="btn-logout">Sign out</button>
      </div>
    </div>
  </main>

  <footer class="login-footer">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </footer>

  <!-- Supabase JS client (ESM CDN — no build step required) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL  = 'https://foxlhoexpadesglemozo.supabase.co';
    // Publishable (anon) key — safe to include in browser code.
    // Never put the service-role key here.
    const SUPABASE_PUBLISHABLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZveGxob2V4cGFkZXNnbGVtb3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA3ODEsImV4cCI6MjEwNDQ1Njc4MX0.efRhGs-K2oN2_bMG5fgp3yFEyl5dUIaI62VxU6rFrXM';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // ── DOM refs ───────────────────────────────────────────────────────────
    const signInSection   = document.getElementById('sign-in-section');
    const userInfoSection = document.getElementById('user-info-section');
    const userEmailEl     = document.getElementById('user-email');
    const btnSignIn       = document.getElementById('btn-google-sign-in');
    const btnLogout       = document.getElementById('btn-logout');
    const statusMsg       = document.getElementById('sign-in-status');

    // ── UI helpers ─────────────────────────────────────────────────────────
    function showSignedIn(email) {
      userEmailEl.textContent        = email || '(email unavailable)';
      signInSection.style.display    = 'none';
      userInfoSection.style.display  = 'block';
    }

    function showSignedOut() {
      signInSection.style.display    = 'block';
      userInfoSection.style.display  = 'none';
    }

    function setStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.className   = 'status-msg' + (isError ? ' error' : '');
    }

    // ── Check for existing session on page load ────────────────────────────
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      showSignedIn(session.user.email);
    } else {
      showSignedOut();
    }

    // ── Listen for auth state changes (handles OAuth redirect callback) ────
    supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        showSignedIn(session.user.email);
      } else {
        showSignedOut();
      }
    });

    // ── Sign in with Google ────────────────────────────────────────────────
    btnSignIn.addEventListener('click', async () => {
      btnSignIn.disabled = true;
      setStatus('Redirecting to Google…');
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/login',
        },
      });
      if (error) {
        setStatus('Sign-in failed: ' + error.message, true);
        btnSignIn.disabled = false;
      }
      // On success the page redirects — no further action needed here.
    });

    // ── Sign out ───────────────────────────────────────────────────────────
    btnLogout.addEventListener('click', async () => {
      btnLogout.disabled = true;
      const { error } = await supabase.auth.signOut();
      if (error) {
        setStatus('Sign-out failed: ' + error.message, true);
        btnLogout.disabled = false;
      }
      // onAuthStateChange fires → showSignedOut() called automatically.
    });
  </script>
</body>
</html>
