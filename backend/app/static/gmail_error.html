<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindMyProfessor — Gmail Connection Error</title>
  <link rel="stylesheet" href="/static/css/fmp.css">
  <style>
    .centered-card {
      min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .status-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-xl); padding: 2.5rem 2.75rem;
      max-width: 460px; width: 100%; text-align: center;
      box-shadow: var(--shadow-md);
    }
    .icon-circle {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem; background: var(--red-bg);
    }
    .status-card h1   { font-size: 1.35rem; margin-bottom: .5rem; }
    .status-card .reason {
      background: var(--red-bg); color: var(--danger);
      border-radius: var(--r-md); padding: .65rem 1rem;
      font-size: .9rem; margin: .75rem 0 1.25rem; text-align: left;
    }
    .action-row { display: flex; gap: .65rem; justify-content: center; flex-wrap: wrap; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <a class="nav-brand" href="/">FindMyProfessor</a>
      <div class="nav-links">
        <a href="/onboarding">CV Profile</a>
        <a href="/matches">Research Matches</a>
      </div>
    </div>
  </nav>

  <div class="centered-card">
    <div class="status-card">
      <div class="icon-circle">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="14" cy="14" r="12"/>
          <line x1="10" y1="10" x2="18" y2="18"/>
          <line x1="18" y1="10" x2="10" y2="18"/>
        </svg>
      </div>
      <h1>Gmail connection failed</h1>
      <p id="error-message" class="reason">The Gmail connection could not be completed.</p>
      <p style="font-size:.875rem;color:var(--muted)">
        You can try connecting again, or return to the app and connect later from the email draft page.
      </p>
      <div class="action-row">
        <a href="/gmail/connect" class="btn-primary">Try Again</a>
        <a href="/matches" class="secondary" style="display:inline-flex;align-items:center;padding:.5rem 1.1rem;border-radius:var(--r-md);border:1px solid var(--line);font-size:.875rem;color:var(--ink);text-decoration:none;">Back to App</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const reason = params.get("reason") || "";
    const messages = {
      denied:          "You declined to grant Gmail access. No connection was made.",
      missing_params:  "The authorization response was incomplete. Please try again.",
      invalid_state:   "The connection request could not be verified (state mismatch). Please try again.",
      exchange_failed: "The authorization code could not be exchanged. Please try again.",
      no_token:        "No access token was returned. Please try again.",
      store_failed:    "The connection could not be saved. Please try again."
    };
    const msg = messages[reason];
    if (msg) document.getElementById("error-message").textContent = msg;
  </script>
</body>
</html>
